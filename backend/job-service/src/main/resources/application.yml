server:
  port: 8082

spring:
  application:
    name: job-service

  # KHỐI 1: Kết nối Database PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  # KHỐI 2: Cấu hình JPA & Hibernate (Validate cấu trúc, không tự sửa DB)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # KHỐI 3: Cấu hình Flyway Migration (Bắt buộc dùng SQL script quản lý DB)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # KHỐI 4: Kết nối Kafka (Đẩy Outbox Event sang ai-service & notification-service)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer