spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**,/.well-known/jwks.json,/admin/**
          filters:
            - PreserveHostHeader

        - id: job-service
          uri: http://localhost:8082
          predicates:
            - Path=/jobs/**
          filters:
            - PreserveHostHeader

        - id: candidate-service
          uri: http://localhost:8083
          predicates:
            - Path=/cvs/**
          filters:
            - PreserveHostHeader

        - id: application-service
          uri: http://localhost:8084
          predicates:
            - Path=/applications/**
          filters:
            - PreserveHostHeader

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notifications/**,/ws/**
          filters:
            - PreserveHostHeader

        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/ai/**
          filters:
            - PreserveHostHeader

server:
  port: 8080

jwt:
  jwks-uri: http://localhost:8081/.well-known/jwks.json

redis:
  host: localhost
  port: 6379