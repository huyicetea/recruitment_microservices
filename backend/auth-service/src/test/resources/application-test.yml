spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  private-key-path: classpath:certs/private_key.pem
  public-key-path: classpath:certs/public_key.pem
  expiration-ms: 900000
  refresh-expiration-days: 7