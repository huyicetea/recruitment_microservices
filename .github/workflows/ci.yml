name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude-dir=target \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude='.github/workflows/ci.yml' \
            .; then
            echo "Merge conflict markers found!"
            exit 1
          fi

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose file
        run: docker compose config

  backend:
    needs: [conflict-check, compose-validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, job-service, candidate-service, application-service, notification-service, common-lib]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build & Test Service
        run: |
          if [ -d "backend/${{ matrix.service }}" ]; then
            cd backend && mvn clean test -pl ${{ matrix.service }} -am
          else
            echo "Directory backend/${{ matrix.service }} does not exist yet. Skipping."
          fi

  ai-service:
    needs: [conflict-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint and Unit Test
        run: |
          if [ -d "ai-service" ] && [ -f "ai-service/pyproject.toml" ]; then
            cd ai-service
            pip install ruff pytest
            ruff check .
            pytest
          else
            echo "AI Service not initialized yet. Skipping."
          fi

  frontend:
    needs: [conflict-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            npm run lint || true
            npm run build
          else
            echo "Frontend not initialized yet. Skipping."
          fi

  ci-success:
    needs: [backend, ai-service, frontend, compose-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Success confirmation
        run: echo "All CI checks completed successfully!"